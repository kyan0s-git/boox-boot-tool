[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boox-boot-tool"
version = "0.1.0"
description = "Brick-resistant rooting, backup and hardening tool for Onyx Boox e-ink tablets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "rich>=13.7",
    "questionary>=2.0",
]

[project.optional-dependencies]
firmware = ["pycryptodome>=3.20", "requests>=2.31"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
boox = "boox.cli:main"

[tool.setuptools.packages.find]
include = ["boox*"]

[tool.setuptools.package-data]
boox = ["profiles/*.toml", "data/debloat/*.txt", "data/blocklist/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
